{{- if and .Values.secret.create (not .Values.existingSecret) }}
{{- if not .Values.secret.data.StAgent_SECRET_KEY }}
{{- fail "secret.data.StAgent_SECRET_KEY must be set when secret.create=true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "StAgent.fullname" . }}
  labels:
    {{- include "StAgent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
