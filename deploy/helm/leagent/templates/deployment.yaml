apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leagent.fullname" . }}
  labels:
    {{- include "leagent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "leagent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "leagent.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "leagent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: leagent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if or .Values.existingSecret .Values.secret.create }}
            - name: LEAGENT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "leagent.fullname" .) .Values.existingSecret }}
                  key: LEAGENT_SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "leagent.fullname" .) .Values.existingSecret }}
                  key: DATABASE_URL
                  optional: true
            - name: LEAGENT_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "leagent.fullname" .) .Values.existingSecret }}
                  key: LEAGENT_REDIS_URL
                  optional: true
            - name: LEAGENT_OBJECT_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "leagent.fullname" .) .Values.existingSecret }}
                  key: LEAGENT_OBJECT_STORAGE_ACCESS_KEY_ID
                  optional: true
            - name: LEAGENT_OBJECT_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "leagent.fullname" .) .Values.existingSecret }}
                  key: LEAGENT_OBJECT_STORAGE_SECRET_ACCESS_KEY
                  optional: true
            - name: LEAGENT_OBJECT_STORAGE_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "leagent.fullname" .) .Values.existingSecret }}
                  key: LEAGENT_OBJECT_STORAGE_SESSION_TOKEN
                  optional: true
            - name: LEAGENT_KNOWLEDGE_OPENSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "leagent.fullname" .) .Values.existingSecret }}
                  key: LEAGENT_KNOWLEDGE_OPENSEARCH_API_KEY
                  optional: true
            - name: LEAGENT_KNOWLEDGE_MILVUS_URI
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "leagent.fullname" .) .Values.existingSecret }}
                  key: LEAGENT_KNOWLEDGE_MILVUS_URI
                  optional: true
            - name: LEAGENT_KNOWLEDGE_MILVUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "leagent.fullname" .) .Values.existingSecret }}
                  key: LEAGENT_KNOWLEDGE_MILVUS_TOKEN
                  optional: true
            - name: LEAGENT_KNOWLEDGE_RERANK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "leagent.fullname" .) .Values.existingSecret }}
                  key: LEAGENT_KNOWLEDGE_RERANK_API_KEY
                  optional: true
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "leagent.fullname" .) .Values.existingSecret }}
                  key: DEEPSEEK_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "leagent.fullname" .) .Values.existingSecret }}
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "leagent.fullname" .) .Values.existingSecret }}
                  key: ANTHROPIC_API_KEY
                  optional: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "leagent.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: uploads
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "leagent.fullname" . }}-uploads
          {{- else }}
          emptyDir: {}
          {{- end }}
