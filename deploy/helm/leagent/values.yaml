replicaCount: 1

image:
  repository: leagent
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: leagent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

env:
  LEAGENT_HOME: /app/data
  LEAGENT_PORT: "8000"
  LEAGENT_HOST: 0.0.0.0
  LEAGENT_ENVIRONMENT: production
  LEAGENT_WORKERS: "1"
  LEAGENT_RUN_MIGRATIONS: "true"
  LEAGENT_MIGRATIONS_REQUIRED: "true"
  LEAGENT_SECURITY_ENFORCE_AUTH: "true"
  LEAGENT_SECURITY_RATE_LIMIT_ENABLED: "true"
  FILES_UPLOAD_DIR: /app/uploads
  # Redis is disabled by default; multiple workers require it at startup.
  LEAGENT_REDIS_ENABLED: "false"
  LEAGENT_REDIS_PREFIX: leagent
  # Endpoint/bucket are non-secret. Credentials remain in existingSecret.
  LEAGENT_OBJECT_STORAGE_ENABLED: "false"
  LEAGENT_OBJECT_STORAGE_ENDPOINT_URL: ""
  LEAGENT_OBJECT_STORAGE_REGION_NAME: us-east-1
  LEAGENT_OBJECT_STORAGE_BUCKET: ""
  LEAGENT_OBJECT_STORAGE_PREFIX: leagent
  # Empty values preserve the local lexical path. Set these only after the
  # corresponding external service has passed its live smoke test.
  LEAGENT_KNOWLEDGE_INDEX_VERSION: rag-v1
  LEAGENT_KNOWLEDGE_OPENSEARCH_URL: ""
  LEAGENT_KNOWLEDGE_OPENSEARCH_INDEX: knowledge_chunks
  LEAGENT_KNOWLEDGE_OPENSEARCH_TIMEOUT_SECONDS: "5"
  LEAGENT_KNOWLEDGE_MILVUS_ENABLED: "false"
  LEAGENT_KNOWLEDGE_MILVUS_HOST: milvus
  LEAGENT_KNOWLEDGE_MILVUS_PORT: "19530"
  LEAGENT_KNOWLEDGE_EMBEDDING_ENABLED: "false"
  LEAGENT_KNOWLEDGE_EMBEDDING_PROVIDER: ""
  LEAGENT_KNOWLEDGE_EMBEDDING_MODEL: ""
  LEAGENT_KNOWLEDGE_EMBEDDING_DIMENSION: "1024"
  LEAGENT_KNOWLEDGE_RERANK_ENDPOINT: ""
  LEAGENT_KNOWLEDGE_RERANK_TIMEOUT_SECONDS: "5"
  LEAGENT_KNOWLEDGE_QUERY_REWRITE_ENABLED: "false"
  LEAGENT_KNOWLEDGE_STRICT_EVIDENCE: "true"
  LEAGENT_KNOWLEDGE_MAX_CONTEXT_TOKENS: "6000"
  LEAGENT_KNOWLEDGE_RECALL_AT_10_TARGET: "0.90"
  LEAGENT_KNOWLEDGE_NDCG_AT_10_TARGET: "0.80"
  LEAGENT_KNOWLEDGE_CITATION_ACCURACY_TARGET: "0.95"
  LEAGENT_KNOWLEDGE_HALLUCINATION_RATE_MAX: "0.02"
  LEAGENT_KNOWLEDGE_RETRIEVAL_P95_MS_TARGET: "5000"

# Prefer an existing Secret in production. Set secret.create=true only when
# supplying secret.data.LEAGENT_SECRET_KEY explicitly.
existingSecret: ""
secret:
  create: false
  data:
    LEAGENT_SECRET_KEY: ""
    DATABASE_URL: ""
    DEEPSEEK_API_KEY: ""
    OPENAI_API_KEY: ""
    ANTHROPIC_API_KEY: ""
    LEAGENT_KNOWLEDGE_OPENSEARCH_API_KEY: ""
    LEAGENT_KNOWLEDGE_MILVUS_URI: ""
    LEAGENT_KNOWLEDGE_MILVUS_TOKEN: ""
    LEAGENT_KNOWLEDGE_RERANK_API_KEY: ""

persistence:
  enabled: true
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 20Gi
  uploadsSize: 50Gi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
