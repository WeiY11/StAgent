# =============================================================================
# StAgent — development overlay (hot reload, same database selection as base)
# Usage from repo root:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d --build
# =============================================================================

name: StAgent

services:
  StAgent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: development
    volumes:
      - ../backend/StAgent:/app/StAgent:cached
      - ../backend/tests:/app/tests:cached
      - ../backend/pyproject.toml:/app/pyproject.toml:ro
      - ../backend/alembic.ini:/app/alembic.ini:ro
      - StAgent-data:/app/data
      - StAgent-uploads:/app/uploads
      - StAgent-logs:/app/logs
      - StAgent-cache:/app/cache
    environment:
      StAgent_DEBUG: "true"
      StAgent_LOG_LEVEL: DEBUG
      StAgent_ENVIRONMENT: development
      StAgent_WORKERS: "1"
    ports:
      - "127.0.0.1:${StAgent_HOST_PORT:-8000}:8000"
      - "127.0.0.1:5678:5678"
    command: >
      uvicorn StAgent.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/StAgent
      --log-level debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: StAgent-mailhog
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
