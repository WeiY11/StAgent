# Pre-commit hooks — mirrors the CI backend-lint gate locally.
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/StAgent/
      - id: ruff-format
        files: ^backend/StAgent/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/StAgent/(runtime|sdk|api/router\.py|config|db|file)
        args: [--config-file=backend/pyproject.toml]
        additional_dependencies:
          - pydantic>=2.10.0
          - types-PyYAML>=6.0.12

  - repo: local
    hooks:
      - id: frontend-eslint
        name: Frontend ESLint
        entry: npm run lint --prefix frontend
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: frontend-typecheck
        name: Frontend TypeScript
        entry: npm run type-check --prefix frontend
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
