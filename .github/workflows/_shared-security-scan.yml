name: Security Scan

on:
  workflow_call:
    inputs:
      run:
        type: boolean
        default: true
      audit-python:
        type: boolean
        default: true
      audit-node:
        type: boolean
        default: true

jobs:
  security-scan:
    name: Security Scan
    if: inputs.run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        if: inputs.audit-python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        if: inputs.audit-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        if: inputs.audit-python
        run: python -m pip install pip-audit

      - name: Export Python production requirements
        if: inputs.audit-python
        run: uv export --frozen --no-hashes --no-dev --no-emit-project --output-file requirements-audit.txt
        working-directory: backend

      - name: Audit Python production dependencies
        if: inputs.audit-python
        run: pip-audit --requirement requirements-audit.txt --desc
        working-directory: backend

      - name: Set up Node.js
        if: inputs.audit-node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        if: inputs.audit-node
        run: npm audit --audit-level=critical
        working-directory: frontend
