name: Docker Smoke Test

on:
  workflow_call:
    inputs:
      run:
        type: boolean
        default: true

jobs:
  docker-smoke:
    name: Docker Smoke
    if: inputs.run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: production
          push: false
          load: true
          tags: StAgent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start built image
        run: |
          docker run -d --name StAgent-smoke \
            -p 127.0.0.1:18000:8000 \
            -e StAgent_SECRET_KEY=test-secret-key-with-at-least-32-bytes \
            -e StAgent_SECURITY_ENFORCE_AUTH=false \
            StAgent:test

      - name: Wait for /health and /api/v1/health/ready
        run: |
          set -e
          for path in /health /api/v1/health/ready; do
            for i in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:18000${path}" >/dev/null; then
                echo "ok: ${path}"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "timed out waiting for ${path}" >&2
                exit 1
              fi
              sleep 2
            done
          done

      - name: Verify runtime imports inside the image
        run: |
          docker exec StAgent-smoke python -c "import StAgent, asyncpg; print(StAgent.__version__)"

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs StAgent-smoke || true
          docker rm -f StAgent-smoke || true
