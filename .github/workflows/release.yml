name: Release

on:
  push:
    tags:
      - 'v*'

# One tag grammar (`v*`) and one publication workflow. `desktop-v*` is retained
# only for beta-only desktop builds (see desktop-release.yml) and never
# publishes to PyPI.
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Fail closed if the tag disagrees with the product versions.
  # ─────────────────────────────────────────────────────────────
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Extract version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG}" == *alpha* || "${TAG}" == *beta* || "${TAG}" == *rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check product versions match the tag
        run: uv run python scripts/check_release_versions.py --tag "${GITHUB_REF_NAME}"
        working-directory: backend

  # ─────────────────────────────────────────────────────────────
  # 2. Tests gate every downstream artifact.
  # ─────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint
    needs: validate-version
    uses: ./.github/workflows/_shared-backend-lint.yml

  backend-test:
    name: Backend Tests
    needs: validate-version
    uses: ./.github/workflows/_shared-backend-test.yml

  fast-contracts:
    name: Fast Backend Contracts
    needs: validate-version
    uses: ./.github/workflows/_shared-fast-contracts.yml

  postgres-contract:
    name: PostgreSQL Contract
    needs: validate-version
    uses: ./.github/workflows/_shared-postgres-contract.yml

  security-scan:
    name: Security Scan
    needs: validate-version
    uses: ./.github/workflows/_shared-security-scan.yml

  frontend:
    name: Frontend
    needs: validate-version
    uses: ./.github/workflows/_shared-frontend.yml
    with:
      coverage: false
      build: true
      upload-build: false

  # ─────────────────────────────────────────────────────────────
  # 3. Docker smoke test.
  # ─────────────────────────────────────────────────────────────
  docker-smoke:
    name: Docker Smoke
    needs: [backend-lint, backend-test, fast-contracts, postgres-contract, security-scan, frontend]
    uses: ./.github/workflows/_shared-docker-smoke.yml

  # ─────────────────────────────────────────────────────────────
  # 4. Build the backend wheel (immutable artifact, no publish yet).
  # ─────────────────────────────────────────────────────────────
  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, fast-contracts, postgres-contract, security-scan, docker-smoke, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build package
        run: uv build
        working-directory: backend
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: backend/dist/*
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 5. Build the three desktop installer sets (no publish yet).
  # ─────────────────────────────────────────────────────────────
  desktop-linux:
    name: Desktop Installer (Linux)
    runs-on: ubuntu-latest
    needs: [validate-version, backend-lint, backend-test, fast-contracts, postgres-contract, security-scan, docker-smoke, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/electron/package-lock.json
      - name: Install Linux packaging deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg fakeroot bc
      - name: Build Linux installers
        run: bash desktop/scripts/build-linux.sh --version "${{ needs.validate-version.outputs.version }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            desktop/electron/dist-pack/*.AppImage
            desktop/electron/dist-pack/*.deb
            desktop/electron/dist-pack/latest*.yml
          if-no-files-found: error

  desktop-macos:
    name: Desktop Installer (macOS)
    runs-on: macos-latest
    needs: [validate-version, backend-lint, backend-test, fast-contracts, postgres-contract, security-scan, docker-smoke, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/electron/package-lock.json
      - name: Build macOS installers
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash desktop/scripts/build-mac.sh --version "${{ needs.validate-version.outputs.version }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: |
            desktop/electron/dist-pack/*.dmg
            desktop/electron/dist-pack/*.zip
            desktop/electron/dist-pack/latest*.yml
          if-no-files-found: error

  desktop-windows:
    name: Desktop Installer (Windows)
    runs-on: windows-latest
    needs: [validate-version, backend-lint, backend-test, fast-contracts, postgres-contract, security-scan, docker-smoke, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/electron/package-lock.json
      - name: Build Windows installer
        shell: pwsh
        run: |
          .\desktop\scripts\build-win.ps1 -Version "${{ needs.validate-version.outputs.version }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            desktop/electron/dist-pack/*.exe
            desktop/electron/dist-pack/*.exe.blockmap
            desktop/electron/dist-pack/latest*.yml
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 6. Only now — after every required artifact exists — publish.
  #    The GitHub Release page is created as a draft, filled, and
  #    only flipped public once PyPI publication has also succeeded.
  # ─────────────────────────────────────────────────────────────
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [validate-version, build-wheel, desktop-linux, desktop-macos, desktop-windows]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create draft release with all artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate-version.outputs.tag }}
          body: ${{ steps.changelog.outputs.content }}
          draft: true
          prerelease: ${{ needs.validate-version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/wheel/*
            dist/desktop-linux/*
            dist/desktop-macos/*
            dist/desktop-windows/*
            scripts/install.sh
            scripts/install.ps1
            scripts/install.bat

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheel
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Flip release to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.validate-version.outputs.tag }}" --draft=false
