name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/**'
            frontend:
              - 'frontend/**'
            desktop:
              - 'desktop/**'
            ci:
              - '.github/workflows/**'

  backend-lint:
    name: Backend Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_shared-backend-lint.yml

  fast-contracts:
    name: Fast Backend Contracts
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_shared-fast-contracts.yml

  backend-test:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_shared-backend-test.yml
    with:
      coverage: true

  postgres-contract:
    name: PostgreSQL Contract
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_shared-postgres-contract.yml

  security-scan:
    name: Security Scan
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_shared-security-scan.yml
    with:
      audit-python: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}
      audit-node: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' }}

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_shared-frontend.yml
    with:
      coverage: true
      upload-build: true

  desktop-test:
    name: Desktop Tests
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: desktop/electron

      - name: Build Electron main process
        run: npm run build
        working-directory: desktop/electron

      - name: Run Electron unit tests
        run: npm test
        working-directory: desktop/electron

  docker-build:
    name: Docker Build
    needs:
      - changes
      - backend-lint
      - fast-contracts
      - backend-test
      - postgres-contract
      - security-scan
      - frontend
      - desktop-test
    if: >-
      always() &&
      !failure() &&
      !cancelled() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/_shared-docker-smoke.yml
