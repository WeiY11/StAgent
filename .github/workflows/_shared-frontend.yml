name: Frontend (Lint + Test + Build)

on:
  workflow_call:
    inputs:
      run:
        type: boolean
        default: true
      coverage:
        type: boolean
        default: false
      build:
        type: boolean
        default: true
      upload-build:
        type: boolean
        default: false

jobs:
  frontend:
    name: Frontend
    if: inputs.run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # ── Lint & type-check ──────────────────────────────────────────

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

      - name: Run TypeScript check
        run: npm run type-check
        working-directory: frontend

      # ── Tests ──────────────────────────────────────────────────────

      - name: Run tests
        if: inputs.coverage
        run: npm run test -- --run --coverage
        working-directory: frontend

      - name: Run tests
        if: ${{ !inputs.coverage }}
        run: npm run test -- --run
        working-directory: frontend

      - name: Upload coverage
        if: inputs.coverage && always() && hashFiles('frontend/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          files: frontend/coverage/lcov.info
          flags: frontend

      # ── Build ──────────────────────────────────────────────────────

      - name: Build
        if: inputs.build
        run: npm run build
        working-directory: frontend

      - name: Check bundle budget
        if: inputs.build
        run: npm run check:bundle
        working-directory: frontend

      - name: Verify non-empty CSS in dist
        if: inputs.build
        run: |
          set -e
          test -d frontend/dist
          count=$(find frontend/dist -type f -name '*.css' ! -empty | wc -l)
          test "$count" -ge 1

      - name: Upload build artifacts
        if: inputs.upload-build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error
